services:
  tluagent:
    image: azenkain/tlu-agent:latest
    container_name: tluagent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3434
      DATA_DIR: /app/data
      SQLITE_DB_PATH: /app/data/tluagent.db
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "${APP_PORT:-3013}:3434"
    stop_grace_period: 60s
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
